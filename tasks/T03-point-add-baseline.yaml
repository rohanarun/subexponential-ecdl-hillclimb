verifier: python -m pytest tests/test_point_add.py -q
bounds:
  curve: "E(F_7): y^2 = x^3 + 2x + 3"
forbidden:
  - claiming the paper's O(b^{3/4}) degree bound
  - editing AXIOMS.md
